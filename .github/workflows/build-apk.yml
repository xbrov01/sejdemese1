name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Capacitor Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Set up Android SDK
        run: |
          if [ -d "/usr/local/lib/android/sdk" ]; then
            SDK_ROOT="/usr/local/lib/android/sdk"
          elif [ -d "$HOME/android-sdk" ]; then
            SDK_ROOT="$HOME/android-sdk"
          else
            SDK_ROOT="$HOME/android-sdk"
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> $GITHUB_ENV

          # Detect or install sdkmanager
          SDK_BIN=""
          for p in "$SDK_ROOT/cmdline-tools/latest/bin" "$SDK_ROOT/cmdline-tools/16.0/bin" "$SDK_ROOT/cmdline-tools/bin" "$SDK_ROOT/platform-tools"; do
            if [ -d "$p" ]; then
              echo "$p" >> $GITHUB_PATH
              if [ -x "$p/sdkmanager" ]; then
                SDK_BIN="$p/sdkmanager"
              fi
            fi
          done

          if [ -z "$SDK_BIN" ]; then
            echo "Installing Android cmdline-tools..."
            mkdir -p "$SDK_ROOT/cmdline-tools"
            wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmdline-tools.zip
            mkdir -p /tmp/cmdline-temp
            unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-temp
            mkdir -p "$SDK_ROOT/cmdline-tools/latest"
            mv /tmp/cmdline-temp/cmdline-tools/* "$SDK_ROOT/cmdline-tools/latest/"
            rm -rf /tmp/cmdline-temp /tmp/cmdline-tools.zip
            SDK_BIN="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
            echo "$SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
          fi

          echo "Accepting Android SDK licenses..."
          yes | "$SDK_BIN" --licenses || true

          echo "Installing Android SDK platforms and build-tools..."
          "$SDK_BIN" "platform-tools" "platforms;android-35" "build-tools;35.0.0" || true

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Web Assets
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sejdemese-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
