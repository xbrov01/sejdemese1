name: Build iOS App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Capacitor iOS App
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Patch Capacitor Status Bar Plugin (SPM compatibility)
        run: node scripts/patch-status-bar.cjs

      - name: Build Web Assets
        run: npm run build

      - name: Sync Capacitor iOS
        run: |
          if [ ! -d "ios" ]; then
            echo "iOS platform directory not found, adding..."
            npx cap add ios
          fi
          npx cap sync ios

      - name: Select Xcode & Verify Environment
        run: |
          for xcode_path in /Applications/Xcode_16.2.app /Applications/Xcode_16.1.app /Applications/Xcode_16.0.app /Applications/Xcode_15.4.app /Applications/Xcode.app; do
            if [ -d "$xcode_path" ]; then
              echo "Selecting Xcode at $xcode_path"
              sudo xcode-select -s "$xcode_path"
              break
            fi
          done
          echo "Active Xcode Version:"
          xcodebuild -version

      - name: Install CocoaPods dependencies (if Podfile exists)
        run: |
          if [ -f ios/App/Podfile ]; then
            echo "Podfile detected, running pod install..."
            cd ios/App
            pod install
          else
            echo "No Podfile detected, project uses Swift Package Manager (SPM)."
          fi

      - name: Build iOS App (Simulator Debug)
        run: |
          mkdir -p build/ios
          if [ -d "ios/App/App.xcworkspace" ]; then
            TARGET_ARG="-workspace ios/App/App.xcworkspace"
          else
            TARGET_ARG="-project ios/App/App.xcodeproj"
          fi

          echo "Compiling iOS App with target: $TARGET_ARG"
          xcodebuild \
            $TARGET_ARG \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build/ios \
            clean build \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Compress iOS App Bundle
        run: |
          APP_PATH=$(find build/ios/Build/Products -name "App.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: App.app not found in build/ios/Build/Products"
            find build/ios -maxdepth 4 -type d 2>/dev/null || true
            exit 1
          fi
          echo "Found compiled App bundle at: $APP_PATH"
          cd "$(dirname "$APP_PATH")"
          zip -r -X "$GITHUB_WORKSPACE/sejdemese-ios-simulator.zip" App.app

      - name: Upload iOS App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sejdemese-ios-simulator
          path: sejdemese-ios-simulator.zip
          retention-days: 30
