name: Build iOS App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Capacitor iOS App
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        shell: bash
        run: npm ci --include=optional

      - name: Build Web Assets & Sync Capacitor iOS
        run: |
          npm run build

          if [ ! -d ios ]; then
            npx cap add ios
          fi

          npx cap sync ios

          # Ensure Podfile exists
          if [ ! -f ios/App/Podfile ]; then
            echo "Podfile not found. Reinitializing iOS platform..."
            npx cap remove ios
            npx cap add ios
            npx cap sync ios
          fi          

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode.app

      - name: Install CocoaPods dependencies
        working-directory: ios/App
        run: pod install

      - name: Verify iOS project
        run: |
          test -f ios/App/App.xcworkspace/contents.xcworkspacedata \
            || { echo "Expected iOS workspace was not generated"; find ios -maxdepth 3 -type f | sort; exit 1; }

      - name: Build iOS App (Simulator Debug)
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build/ios \
            clean build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Compress iOS App Bundle
        run: |
          APP_PATH=$(find build/ios/Build/Products -name "App.app" -type d | head -n 1)
          cd "$(dirname "$APP_PATH")"
          zip -r -X "$GITHUB_WORKSPACE/sejdemese-ios-simulator.zip" App.app

      - name: Upload iOS App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sejdemese-ios-simulator
          path: sejdemese-ios-simulator.zip
          retention-days: 30
