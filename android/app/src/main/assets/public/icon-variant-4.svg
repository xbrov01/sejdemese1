<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="v4-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="v4-jersey-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="v4-jersey-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="v4-spark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <filter id="v4-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.5" />
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#059669" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="120" fill="url(#v4-bg)" />
  <rect width="512" height="512" rx="120" fill="none" stroke="#4338ca" stroke-width="2" opacity="0.4" />

  <!-- Ambient Light -->
  <circle cx="256" cy="256" r="180" fill="#10b981" opacity="0.1" />

  <g filter="url(#v4-shadow)">
    <!-- Left Team Player / Jersey -->
    <path d="M 130,170 
             L 180,130 
             L 216,160 
             C 216,160 196,178 196,198 
             L 196,360 
             L 120,360 
             L 120,220 
             L 94,200 
             Z" 
          fill="url(#v4-jersey-left)" 
          stroke="#ffffff" 
          stroke-width="4" />

    <!-- Left Player Number / Accent -->
    <rect x="146" y="230" width="28" height="60" rx="6" fill="#ffffff" opacity="0.9" />

    <!-- Right Team Player / Jersey -->
    <path d="M 382,170 
             L 332,130 
             L 296,160 
             C 296,160 316,178 316,198 
             L 316,360 
             L 392,360 
             L 392,220 
             L 418,200 
             Z" 
          fill="url(#v4-jersey-right)" 
          stroke="#ffffff" 
          stroke-width="4" />

    <!-- Right Player Number / Accent -->
    <rect x="338" y="230" width="28" height="60" rx="6" fill="#ffffff" opacity="0.9" />

    <!-- High-Five / Team Handshake Connection Clasping at Center forming letter 'S' -->
    <path d="M 176,210 
             C 176,210 236,180 256,220 
             C 276,260 236,300 256,340 
             C 276,380 336,350 336,350" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="16" 
          stroke-linecap="round" />

    <!-- Golden High-Five Energy Spark at center -->
    <polygon points="256,150 264,170 286,172 268,186 274,208 256,194 238,208 244,186 226,172 248,170" fill="url(#v4-spark)" />

    <!-- Bottom Checkmark Badge of agreement ("Sejdeme se - Platí!") -->
    <circle cx="256" cy="380" r="44" fill="#10b981" stroke="#ffffff" stroke-width="5" />
    <path d="M 238,380 L 250,394 L 276,366" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
