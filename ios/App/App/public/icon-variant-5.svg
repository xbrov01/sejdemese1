<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="v5-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#022c22" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="v5-pitch-stripe" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <linearGradient id="v5-glow-q" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>

    <radialGradient id="v5-spotlight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45" />
      <stop offset="60%" stop-color="#34d399" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#022c22" stop-opacity="0" />
    </radialGradient>

    <filter id="v5-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#34d399" flood-opacity="0.7" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="120" fill="url(#v5-bg)" />
  <rect width="512" height="512" rx="120" fill="none" stroke="#10b981" stroke-width="3" opacity="0.4" />

  <!-- Stadium Grass Stripes (Isometric / Top-down pitch pattern) -->
  <g opacity="0.35">
    <rect x="80" y="90" width="352" height="42" fill="#10b981" />
    <rect x="80" y="174" width="352" height="42" fill="#10b981" />
    <rect x="80" y="258" width="352" height="42" fill="#10b981" />
    <rect x="80" y="342" width="352" height="42" fill="#10b981" />
  </g>

  <!-- Stadium Pitch Border & White Line Markings -->
  <rect x="80" y="90" width="352" height="332" rx="20" fill="none" stroke="#ffffff" stroke-width="5" opacity="0.8" />
  <line x1="80" y1="256" x2="432" y2="256" stroke="#ffffff" stroke-width="4" opacity="0.8" />
  <circle cx="256" cy="256" r="64" fill="none" stroke="#ffffff" stroke-width="4" opacity="0.8" />
  <circle cx="256" cy="256" r="6" fill="#ffffff" opacity="0.9" />

  <!-- Goal Areas -->
  <rect x="180" y="90" width="152" height="48" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.7" />
  <rect x="180" y="374" width="152" height="48" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.7" />

  <!-- Stadium Corner Floodlights -->
  <g fill="#ffffff" opacity="0.95">
    <circle cx="106" cy="116" r="8" />
    <circle cx="406" cy="116" r="8" />
    <circle cx="106" cy="396" r="8" />
    <circle cx="406" cy="396" r="8" />
  </g>

  <!-- Big Midfield Spotlight -->
  <circle cx="256" cy="256" r="170" fill="url(#v5-spotlight)" />

  <!-- Stylized Neon "Sejdeme se?" Question Mark & Center Attendance Checkmark -->
  <g filter="url(#v5-shadow)">
    <!-- Elegant Neon Question Mark wrapping center circle -->
    <path d="M 200,165 
             C 200,130 230,105 270,105 
             C 315,105 348,135 348,175 
             C 348,220 300,240 275,270 
             L 275,295" 
          fill="none" 
          stroke="#fbbf24" 
          stroke-width="15" 
          stroke-linecap="round" />

    <!-- Center Field Victory Attendance Shield / Badge -->
    <circle cx="256" cy="256" r="54" fill="#047857" stroke="#ffffff" stroke-width="5" />
    <circle cx="256" cy="256" r="44" fill="#10b981" />

    <!-- Center Field Checkmark -->
    <path d="M 234,256 L 250,272 L 282,238" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="10" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Question Mark Point Dot -->
    <circle cx="275" cy="335" r="9" fill="#fbbf24" stroke="#ffffff" stroke-width="2" />
  </g>
</svg>
